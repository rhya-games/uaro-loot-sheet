<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · uaRO Loot Sheet</title>
    <!-- GitHub Pages serves this file for any address it has no file for, at any
         depth (/uaro-loot-sheet/a/b/c), so every address here is absolute. Vite
         copies public/ as it is and doesn't add the base path. -->
    <link rel="icon" type="image/svg+xml" href="/uaro-loot-sheet/favicon.svg" />
    <meta name="theme-color" content="#065f46" />
    <style>
      /* The site's colors (src/index.css), plain CSS because Tailwind isn't loaded here. */
      :root {
        --page: #f9fafb;
        --surface: #fff;
        --line: #e5e7eb;
        --fg: #111827;
        --body: #374151;
        --accent: #065f46;
        --focus: #059669;
      }
      .dark {
        color-scheme: dark;
        --page: oklch(0.17 0.01 265);
        --surface: oklch(0.21 0.012 265);
        --line: oklch(0.31 0.014 265);
        --fg: oklch(0.95 0.005 265);
        --body: oklch(0.85 0.008 265);
        --accent: oklch(0.8 0.08 165);
        --focus: oklch(0.75 0.1 165);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--page);
        color: var(--body);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 24px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--fg);
      }
      p {
        margin: 0 0 12px;
      }
      a {
        color: var(--accent);
      }
      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
        border-radius: 2px;
      }
    </style>
    <script>
      // Same light or dark choice as index.html, before the page draws.
      try {
        var saved = JSON.parse(localStorage.getItem('uaro-loot-sheet:theme'));
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (error) {}
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is no page at this address.</p>
      <p><a href="/uaro-loot-sheet/">Go to the Loot Sheet</a></p>
    </main>
  </body>
</html>
