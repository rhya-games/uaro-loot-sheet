# Runs every check on pull requests and pushes to main, so mistakes are
# caught before they go live:
#   validate - the item data (loot.json, overrides, changelog versions)
#   lint     - code problems (unused names, hooks used wrong, missing imports)
#   test     - the search, share links, prices and suggestion formula
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm test
