<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rhya's uaRO Loot Sheet: quickly determine what to do with your loot." />
    <title>uaRO Loot Sheet</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPhones and iPads use a PNG when the site is added to the home screen (a full-bleed copy of favicon.svg, 180x180). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- What chat apps (Discord, Messages…) show when someone shares a link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rhya's uaRO Loot Sheet" />
    <meta property="og:title" content="uaRO Loot Sheet" />
    <meta property="og:description" content="Quickly determine what to do with your loot: keep it, vend it, or sell it to an NPC." />
    <!-- Link previews need full addresses, so these can't use the site's base path. -->
    <meta property="og:url" content="https://rhya-games.github.io/uaro-loot-sheet/" />
    <meta property="og:image" content="https://rhya-games.github.io/uaro-loot-sheet/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A loot bag with a z on it, beside the text uaRO Loot Sheet." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://rhya-games.github.io/uaro-loot-sheet/" />
    <meta name="theme-color" content="#065f46" />
    <script>
      // Pick light or dark before the page draws, so there's no white flash.
      // Uses the choice saved by the header's theme toggle, or the system setting.
      // Keep in sync with src/utils/theme.js.
      try {
        var saved = JSON.parse(localStorage.getItem('uaro-loot-sheet:theme'));
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (error) {}
    </script>
    <!-- Without JavaScript the theme script above doesn't run, so the message
         follows the system light or dark setting with plain CSS. Same colors
         as 404.html (see src/index.css). -->
    <noscript>
      <style>
        body {
          margin: 0;
          padding: 24px;
          background: #f9fafb;
          color: #374151;
          font-family: ui-sans-serif, system-ui, sans-serif;
        }
        .no-script {
          max-width: 28rem;
          margin: 10vh auto 0;
          padding: 24px;
          text-align: center;
          background: #fff;
          border: 1px solid #e5e7eb;
          border-radius: 12px;
        }
        .no-script h1 {
          margin: 0 0 12px;
          font-size: 1.25rem;
          font-weight: 600;
          color: #111827;
        }
        .no-script p {
          margin: 0;
        }
        @media (prefers-color-scheme: dark) {
          body {
            background: oklch(0.17 0.01 265);
            color: oklch(0.85 0.008 265);
          }
          .no-script {
            background: oklch(0.21 0.012 265);
            border-color: oklch(0.31 0.014 265);
          }
          .no-script h1 {
            color: oklch(0.95 0.005 265);
          }
        }
      </style>
    </noscript>
  </head>
  <body>
    <noscript>
      <div class="no-script" role="alert">
        <h1>JavaScript is turned off</h1>
        <p>The uaRO Loot Sheet needs JavaScript to show the items. Turn it on in your browser, then reload this page.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
